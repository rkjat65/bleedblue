<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Team India">
  <defs>
    <linearGradient id="tri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Soft cyan rim -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Brand tile -->
  <rect x="10" y="10" width="44" height="44" rx="11" fill="url(#tri)"/>
  <!-- IND text -->
  <text x="32" y="38.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="0.04em" fill="#0A0A0F">IND</text>
</svg>
