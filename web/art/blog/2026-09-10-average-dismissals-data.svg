  <g font-family="Arial,sans-serif"><rect x="70" y="250" width="500" height="340" rx="20" fill="#0c2a52" stroke="#4e88d0" stroke-opacity=".55"/><rect x="630" y="250" width="500" height="340" rx="20" fill="#2a2116" stroke="#e5aa48" stroke-opacity=".7"/>
    <text x="105" y="305" fill="#fff" font-size="30" font-weight="700">Virat Kohli</text><text x="105" y="337" fill="#9fcaff" font-size="17">INDIA · MEN’S ODI</text>
    <text x="665" y="305" fill="#fff" font-size="30" font-weight="700">Rohit Sharma</text><text x="665" y="337" fill="#f5cb7d" font-size="17">INDIA · MEN’S ODI</text>
    <text x="105" y="392" fill="#a9c4e5" font-size="16">RUNS</text><text x="105" y="435" fill="#fff" font-size="38" font-weight="700">14,941</text><text x="105" y="478" fill="#a9c4e5" font-size="16">DISMISSALS</text><text x="105" y="518" fill="#fff" font-size="32" font-weight="700">255</text>
    <text x="665" y="392" fill="#e8c17d" font-size="16">RUNS</text><text x="665" y="435" fill="#fff" font-size="38" font-weight="700">11,895</text><text x="665" y="478" fill="#e8c17d" font-size="16">DISMISSALS</text><text x="665" y="518" fill="#fff" font-size="32" font-weight="700">243</text>
    <text x="350" y="392" fill="#a9c4e5" font-size="16">BATTING AVERAGE</text><text x="350" y="450" fill="#72c0ff" font-size="52" font-weight="700">58.59</text>
    <text x="910" y="392" fill="#e8c17d" font-size="16">BATTING AVERAGE</text><text x="910" y="450" fill="#ffd886" font-size="52" font-weight="700">48.95</text>
