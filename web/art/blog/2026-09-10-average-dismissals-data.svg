<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ODI batting average: Virat Kohli 58.59 and Rohit Sharma 48.95</title>
  <desc id="desc">A data infographic comparing ODI runs, dismissals and batting averages.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b36"/><stop offset="1" stop-color="#123c78"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#55a9ff"/><stop offset="1" stop-color="#2d63d8"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#ffe2a1"/><stop offset="1" stop-color="#d8932b"/></linearGradient></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="180" fill="#2a69c9" opacity=".18"/><circle cx="80" cy="700" r="220" fill="#e8a63c" opacity=".08"/>
  <text x="70" y="78" fill="#9fcaff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">CRICKET WICKET · DATA NOTE</text>
  <text x="70" y="140" fill="#fff" font-family="Georgia,serif" font-size="48" font-weight="700">Average needs dismissals</text>
