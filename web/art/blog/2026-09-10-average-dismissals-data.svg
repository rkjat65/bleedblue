  <rect x="70" y="635" width="1060" height="72" rx="16" fill="#07172d" stroke="#4e88d0" stroke-opacity=".45"/>
  <text x="100" y="679" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">FORMULA</text><text x="265" y="679" fill="#c7d8f0" font-family="Arial,sans-serif" font-size="22">Batting average = total runs ÷ times dismissed</text><text x="1010" y="679" fill="#f5cb7d" font-family="Arial,sans-serif" font-size="20" text-anchor="end">58.59 &gt; 48.95</text>
