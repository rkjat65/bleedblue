<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How to compare two international batters</title>
  <desc id="desc">A Cricket Wicket infographic explaining volume, efficiency and pace with a Virat Kohli and Rohit Sharma ODI example.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a34"/><stop offset="1" stop-color="#123d78"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#7db4ff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4b942"/><stop offset="1" stop-color="#ffd77b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020b1b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="160" fill="#3b82f6" opacity=".12"/>
  <circle cx="1100" cy="690" r="210" fill="#f4b942" opacity=".08"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="72" y="72" font-size="20" font-weight="700" letter-spacing="4" fill="#9cc6ff">CRICKET WICKET · DAILY NOTE</text>
    <text x="72" y="138" font-size="48" font-weight="800">Compare batters in 60 seconds</text>
    <text x="72" y="178" font-size="21" fill="#c6d7ef">Read volume, efficiency and pace together — in the same format.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="224" width="332" height="300" rx="20" fill="#fff"/>
    <rect x="434" y="224" width="332" height="300" rx="20" fill="#fff"/>
    <rect x="796" y="224" width="332" height="300" rx="20" fill="#fff"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#10233f">
      <text x="104" y="270" font-size="18" font-weight="800" letter-spacing="2">1 · VOLUME</text>
      <text x="104" y="314" font-size="30" font-weight="800">Runs + innings</text>
      <text x="104" y="350" font-size="17" fill="#5d7391">How much did they score?</text>
      <text x="104" y="404" font-size="17" font-weight="700">Virat Kohli</text><text x="320" y="404" text-anchor="end" font-size="17" font-weight="800">14,941 runs</text>
      <rect x="104" y="416" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="104" y="416" width="216" height="13" rx="7" fill="url(#blue)"/>
      <text x="104" y="464" font-size="17" font-weight="700">Rohit Sharma</text><text x="320" y="464" text-anchor="end" font-size="17" font-weight="800">11,895 runs</text>
      <rect x="104" y="476" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="104" y="476" width="172" height="13" rx="7" fill="url(#gold)"/>
    </g>
    <g fill="#10233f">
      <text x="466" y="270" font-size="18" font-weight="800" letter-spacing="2">2 · EFFICIENCY</text>
      <text x="466" y="314" font-size="30" font-weight="800">Average</text>
      <text x="466" y="350" font-size="17" fill="#5d7391">Runs per dismissal</text>
      <text x="466" y="404" font-size="17" font-weight="700">Virat Kohli</text><text x="682" y="404" text-anchor="end" font-size="17" font-weight="800">58.59</text>
      <rect x="466" y="416" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="466" y="416" width="216" height="13" rx="7" fill="url(#blue)"/>
      <text x="466" y="464" font-size="17" font-weight="700">Rohit Sharma</text><text x="682" y="464" text-anchor="end" font-size="17" font-weight="800">48.95</text>
      <rect x="466" y="476" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="466" y="476" width="180" height="13" rx="7" fill="url(#gold)"/>
    </g>
    <g fill="#10233f">
      <text x="828" y="270" font-size="18" font-weight="800" letter-spacing="2">3 · PACE</text>
      <text x="828" y="314" font-size="30" font-weight="800">Strike rate</text>
      <text x="828" y="350" font-size="17" fill="#5d7391">Runs per 100 balls</text>
      <text x="828" y="404" font-size="17" font-weight="700">Virat Kohli</text><text x="1044" y="404" text-anchor="end" font-size="17" font-weight="800">93.95</text>
      <rect x="828" y="416" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="828" y="416" width="216" height="13" rx="7" fill="url(#blue)"/>
      <text x="828" y="464" font-size="17" font-weight="700">Rohit Sharma</text><text x="1044" y="464" text-anchor="end" font-size="17" font-weight="800">93.04</text>
      <rect x="828" y="476" width="216" height="13" rx="7" fill="#e7eef8"/><rect x="828" y="476" width="214" height="13" rx="7" fill="url(#gold)"/>
    </g>
  </g>
  <rect x="72" y="570" width="1056" height="112" rx="18" fill="#06152b" stroke="#487dbd" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="104" y="613" font-size="18" font-weight="800" fill="#f4b942">THE FAIR-COMPARISON RULE</text>
    <text x="104" y="648" font-size="22" font-weight="700" fill="#fff">Same format · same gender · same career scope</text>
    <text x="104" y="674" font-size="16" fill="#b8cbe5">Runs reward volume. Average rewards consistency. Strike rate describes scoring pace.</text>
  </g>
</svg>
